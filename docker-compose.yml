# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ClaimLens — Docker Compose
# Runs: FastAPI backend + TensorFlow Serving
#
# Usage:
#   docker-compose up --build
#
# CHANGE: volume paths to where your trained models live
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

version: "3.9"

services:

  # ── FastAPI Backend ─────────────────────────────────────────────────────
  api:
    build: .
    container_name: claimlens_api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - TF_SERVING_HOST=tf_serving       # must match service name below
      - TF_SERVING_REST_PORT=8501
      - DATABASE_URL=sqlite+aiosqlite:///./claimlens.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads           # video upload storage
      - ./claimlens.db:/app/claimlens.db # SQLite DB persistence
    depends_on:
      - tf_serving
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── TensorFlow Serving ──────────────────────────────────────────────────
  tf_serving:
    image: tensorflow/serving:2.15.0
    container_name: claimlens_tf_serving
    ports:
      - "8501:8501"    # REST API
      - "8500:8500"    # gRPC
    volumes:
      # ┌────────────────────────────────────────────────────────────────────┐
      # │ CHANGE THESE to the actual paths of your trained SavedModel dirs   │
      # │                                                                     │
      # │ Expected structure:                                                 │
      # │   models/saved_models/                                             │
      # │     damage_model/1/saved_model.pb + variables/                    │
      # │     vehicle_model/1/saved_model.pb + variables/                   │
      # │     plate_model/1/saved_model.pb + variables/                     │
      # │                                                                     │
      # │ The "1" subfolder is the version number — TF Serving requires it   │
      # └────────────────────────────────────────────────────────────────────┘
      - ./models/saved_models/damage_model:/models/damage_model
      - ./models/saved_models/vehicle_model:/models/vehicle_model
      - ./models/saved_models/plate_model:/models/plate_model
      - ./models/tf_serving.config:/models/tf_serving.config
    environment:
      - MODEL_CONFIG_FILE=/models/tf_serving.config
    command: --model_config_file=/models/tf_serving.config
    restart: unless-stopped

volumes:
  uploads:
  models:
